name: Deploy para Hostinger

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /public_html/itau/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/README*.md
            **/PROJETO_FINALIZADO.md
            **/DEPLOY_CHECKLIST.md
            **/COMECE_AQUI.md
            **/COMO_USAR*.md
            **/PUBLICACAO*.md
            **/SETUP*.md
            **/*.env*
            **/package-lock.json
            **/server.js
            **/package.json
            **/railway.json
